name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: mobile

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: mobile
        continue-on-error: true

      - name: Lint
        run: bun run lint
        working-directory: mobile

      - name: Test
        run: bun run test
        working-directory: mobile
