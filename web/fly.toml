app = 'membooks-web'
primary_region = 'cdg'

[build]

[env]
  PORT = '3001'
  NODE_ENV = 'production'
  API_URL = 'http://membooks-api.internal:3000'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
